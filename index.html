<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>見下ろし視点 歩行デモ</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #14141a;
    color: #e8e8ef;
    font-family: system-ui, sans-serif;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  canvas {
    /* ドット絵を拡大してもぼやけないようにする */
    image-rendering: pixelated;
    background: #000;
    box-shadow: 0 0 0 2px #33333f;
  }
  .hint {
    font-size: 12px;
    opacity: 0.7;
  }
  #error {
    max-width: 40em;
    padding: 12px 16px;
    border: 1px solid #a33;
    border-radius: 6px;
    background: #2a1a1e;
    white-space: pre-wrap;
    font-size: 13px;
  }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <p class="hint">矢印キー / WASD で移動 &nbsp;・&nbsp; F1 でデバッグ表示</p>
  <div id="error" hidden></div>

  <!-- 読み込み順に依存があるため module ではなく通常の script で読む。
       こうすると index.html をブラウザで直接開くだけで動く。 -->
  <script src="src/config.js"></script>
  <script src="src/input.js"></script>
  <script src="src/sprite.js"></script>
  <script src="src/world.js"></script>
  <script src="src/camera.js"></script>
  <script src="src/player.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
